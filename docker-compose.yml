services:
  etl:
    build: .
    image: iris-coal-etl:1.0
    profiles:
      - etl
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iris_coal}
      IRIS_DB_HOST: postgis
      IRIS_DB_PORT: "5432"
    depends_on:
      postgis:
        condition: service_healthy
    command: ["python", "src/load_coal_postgis.py"]
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./reports:/app/reports

  postgis:
    image: postgis/postgis:16-3.4
    container_name: iris-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iris_coal}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - iris_postgis_data:/var/lib/postgresql/data
      - ./sql/create_staging_table.sql:/docker-entrypoint-initdb.d/01-create-staging-table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris_coal"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  iris_postgis_data:
    name: iris_postgis_data